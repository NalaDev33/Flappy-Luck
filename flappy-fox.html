<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Fox</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  canvas {
    display: block;
    border-radius: 12px;
    max-width: 100vw;
    max-height: 100vh;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Responsive sizing
function resize() {
  const MAX_W = 400;
  const MAX_H = 600;
  const s = Math.min(window.innerWidth / MAX_W, window.innerHeight / MAX_H, 1.2);
  canvas.width = MAX_W;
  canvas.height = MAX_H;
  canvas.style.width = (MAX_W * s) + 'px';
  canvas.style.height = (MAX_H * s) + 'px';
}
resize();
window.addEventListener('resize', resize);

const W = 400;
const H = 600;

// Colors
const COL = {
  sky1: '#0f0c29', sky2: '#302b63', sky3: '#24243e',
  ground: '#2d1b69', groundLine: '#ff6b35',
  pipe: '#7c3aed', pipeEdge: '#a855f7', pipeHi: '#c084fc',
  text: '#fff', gold: '#fbbf24',
  scoreBox: 'rgba(124,58,237,0.6)',
  skin: '#ffcc99', hat: '#2d8c3c', hatBand: '#1a1a1a', hatBuckle: '#fbbf24',
  beard: '#e87d2f', beardDark: '#c46a1f',
  eyeWhite: '#fff', pupil: '#1a1a2e', eyeShine: '#fff',
  cheek: '#ff9a76', nose: '#f4a460', mouth: '#c0392b'
};

let bird, pipes, particles, stars;
let score = 0, bestScore = 0;
let gameState = 'start';
let frame = 0, groundX = 0, flashAlpha = 0;

const GRAV = 0.45, FLAP = -7.5, PSPD = 2.5, GAP = 145, PW = 55, SPAWN = 170;
const BSIZE = 22, GH = 60;

function mkStars() {
  stars = [];
  for (let i = 0; i < 60; i++) stars.push({
    x: Math.random()*W, y: Math.random()*(H-GH),
    sz: Math.random()*2+0.5, tw: Math.random()*Math.PI*2, sp: Math.random()*0.02+0.01
  });
}

function reset() {
  bird = { x: W*0.3, y: H*0.4, vy: 0, rot: 0 };
  pipes = []; particles = [];
  score = 0; frame = 0; groundX = 0; flashAlpha = 0;
}

function flap() {
  if (gameState === 'start') { gameState = 'playing'; reset(); bird.vy = FLAP; return; }
  if (gameState === 'playing') {
    bird.vy = FLAP;
    for (let i = 0; i < 3; i++) particles.push({
      x: bird.x-5, y: bird.y+10, vx: -Math.random()*2-1, vy: Math.random()*2-1,
      life: 1, sz: Math.random()*3+2, col: COL.hat
    });
    return;
  }
  if (gameState === 'dead') { gameState = 'start'; reset(); }
}

canvas.addEventListener('click', flap);
canvas.addEventListener('touchstart', e => { e.preventDefault(); flap(); });
document.addEventListener('keydown', e => { if (e.code==='Space') { e.preventDefault(); flap(); }});

function spawnPipe() {
  const minY = 80, maxY = H-GH-GAP-80;
  pipes.push({ x: W+10, topH: Math.random()*(maxY-minY)+minY, scored: false, flash: 0 });
}

function update() {
  frame++;
  if (gameState !== 'playing') {
    if (gameState === 'start') bird.y = H*0.4 + Math.sin(frame*0.05)*15;
    groundX = (groundX+1)%40;
    return;
  }
  bird.vy += GRAV; bird.y += bird.vy;
  bird.rot = Math.min(Math.max(bird.vy*3, -30), 70);
  groundX = (groundX+PSPD)%40;

  if (frame%SPAWN===0 || (pipes.length===0 && frame>30)) spawnPipe();

  for (let i = pipes.length-1; i >= 0; i--) {
    pipes[i].x -= PSPD;
    if (pipes[i].flash > 0) pipes[i].flash -= 0.05;
    if (!pipes[i].scored && pipes[i].x+PW < bird.x) {
      pipes[i].scored = true; pipes[i].flash = 1; score++;
      for (let j = 0; j < 8; j++) {
        const a = (Math.PI*2/8)*j;
        particles.push({ x:bird.x, y:bird.y, vx:Math.cos(a)*3, vy:Math.sin(a)*3,
          life:1, sz:Math.random()*3+2, col:COL.gold });
      }
    }
    if (pipes[i].x+PW < -10) pipes.splice(i,1);
  }

  for (let i = particles.length-1; i >= 0; i--) {
    particles[i].x += particles[i].vx; particles[i].y += particles[i].vy;
    particles[i].life -= 0.03;
    if (particles[i].life <= 0) particles.splice(i,1);
  }

  if (flashAlpha > 0) flashAlpha -= 0.05;
  if (bird.y+BSIZE > H-GH) { die(); return; }
  if (bird.y-BSIZE < 0) { bird.y = BSIZE; bird.vy = 0; }

  for (const p of pipes) {
    const r = BSIZE-3;
    if (bird.x+r > p.x && bird.x-r < p.x+PW) {
      if (bird.y-r < p.topH || bird.y+r > p.topH+GAP) { die(); return; }
    }
  }
}

function die() {
  gameState = 'dead'; flashAlpha = 1;
  if (score > bestScore) bestScore = score;
  for (let i = 0; i < 12; i++) particles.push({
    x:bird.x, y:bird.y, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6,
    life:1, sz:Math.random()*4+2, col: Math.random()>0.5 ? COL.hat : COL.beard
  });
}

// ---- DRAW ----

function drawBg() {
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,COL.sky1); g.addColorStop(0.5,COL.sky2); g.addColorStop(1,COL.sky3);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  for (const s of stars) {
    s.tw += s.sp;
    ctx.fillStyle = `rgba(255,255,255,${0.3+Math.sin(s.tw)*0.3})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.sz,0,Math.PI*2); ctx.fill();
  }
}

function drawGround() {
  const g = ctx.createLinearGradient(0,H-GH,0,H);
  g.addColorStop(0,'#2d1b69'); g.addColorStop(1,'#1a0e3e');
  ctx.fillStyle = g; ctx.fillRect(0,H-GH,W,GH);
  ctx.strokeStyle = COL.groundLine; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0,H-GH); ctx.lineTo(W,H-GH); ctx.stroke();
  ctx.strokeStyle = 'rgba(124,58,237,0.3)'; ctx.lineWidth = 1;
  for (let x = -groundX; x < W+40; x += 40) {
    ctx.beginPath(); ctx.moveTo(x,H-GH+10); ctx.lineTo(x+20,H-GH+30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+20,H-GH+10); ctx.lineTo(x,H-GH+30); ctx.stroke();
  }
}

function drawPipe(p) {
  const tG = ctx.createLinearGradient(p.x,0,p.x+PW,0);
  tG.addColorStop(0,COL.pipe); tG.addColorStop(0.3,COL.pipeHi); tG.addColorStop(1,COL.pipe);
  if (p.flash>0) { ctx.shadowColor=COL.gold; ctx.shadowBlur=20*p.flash; }

  ctx.fillStyle = tG;
  ctx.beginPath(); ctx.roundRect(p.x+3,0,PW-6,p.topH-15,[0,0,4,4]); ctx.fill();
  ctx.fillStyle = COL.pipeEdge;
  ctx.beginPath(); ctx.roundRect(p.x-3,p.topH-25,PW+6,25,[4,4,4,4]); ctx.fill();

  const bY = p.topH+GAP;
  ctx.fillStyle = tG;
  ctx.beginPath(); ctx.roundRect(p.x+3,bY+15,PW-6,H-GH-bY,[4,4,0,0]); ctx.fill();
  ctx.fillStyle = COL.pipeEdge;
  ctx.beginPath(); ctx.roundRect(p.x-3,bY,PW+6,25,[4,4,4,4]); ctx.fill();
  ctx.shadowBlur = 0;
}

function drawLeprechaun() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  const r = bird.rot || 0;
  ctx.rotate(r * Math.PI / 180);

  const S = BSIZE; // base scale ~22

  // Face glow
  ctx.shadowColor = '#2d8c3c';
  ctx.shadowBlur = 12;

  // Face (circle)
  ctx.fillStyle = COL.skin;
  ctx.beginPath();
  ctx.arc(0, 0, S, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Rosy cheeks
  ctx.fillStyle = 'rgba(255,154,118,0.4)';
  ctx.beginPath(); ctx.arc(-10, 6, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(10, 6, 5, 0, Math.PI*2); ctx.fill();

  // Eyes
  ctx.fillStyle = COL.eyeWhite;
  ctx.beginPath(); ctx.ellipse(-7, -4, 5, 6, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7, -4, 5, 6, 0, 0, Math.PI*2); ctx.fill();

  // Pupils (looking forward)
  ctx.fillStyle = COL.pupil;
  ctx.beginPath(); ctx.arc(-5.5, -3, 2.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(8.5, -3, 2.8, 0, Math.PI*2); ctx.fill();

  // Eye shine
  ctx.fillStyle = COL.eyeShine;
  ctx.beginPath(); ctx.arc(-4.5, -5, 1.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(9.5, -5, 1.3, 0, Math.PI*2); ctx.fill();

  // Eyebrows
  ctx.strokeStyle = COL.beard;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-12,-10); ctx.quadraticCurveTo(-7,-14,-2,-10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2,-10); ctx.quadraticCurveTo(7,-14,12,-10); ctx.stroke();

  // Nose (round)
  ctx.fillStyle = COL.nose;
  ctx.beginPath(); ctx.arc(0, 3, 4, 0, Math.PI*2); ctx.fill();

  // Mouth (smile)
  ctx.strokeStyle = COL.mouth;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 6, 7, 0.15*Math.PI, 0.85*Math.PI);
  ctx.stroke();

  // Beard - full bushy orange beard
  ctx.fillStyle = COL.beard;
  // Main beard shape
  ctx.beginPath();
  ctx.moveTo(-18, 8);
  ctx.quadraticCurveTo(-20, 22, -10, 30);
  ctx.quadraticCurveTo(0, 36, 10, 30);
  ctx.quadraticCurveTo(20, 22, 18, 8);
  ctx.quadraticCurveTo(14, 14, 0, 16);
  ctx.quadraticCurveTo(-14, 14, -18, 8);
  ctx.fill();

  // Beard highlight curls
  ctx.fillStyle = COL.beardDark;
  ctx.beginPath(); ctx.arc(-8, 24, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4, 26, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, 22, 3, 0, Math.PI*2); ctx.fill();

  // Sideburns
  ctx.fillStyle = COL.beard;
  ctx.beginPath();
  ctx.moveTo(-S+2, -4);
  ctx.quadraticCurveTo(-S-4, 8, -S+2, 14);
  ctx.quadraticCurveTo(-S+6, 10, -S+2, -4);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(S-2, -4);
  ctx.quadraticCurveTo(S+4, 8, S-2, 14);
  ctx.quadraticCurveTo(S-6, 10, S-2, -4);
  ctx.fill();

  // HAT
  // Hat brim
  ctx.fillStyle = COL.hat;
  ctx.beginPath();
  ctx.ellipse(0, -S+2, S+8, 6, 0, 0, Math.PI*2);
  ctx.fill();

  // Hat body
  ctx.fillStyle = COL.hat;
  ctx.beginPath();
  ctx.roundRect(-14, -S-22, 28, 24, [6,6,0,0]);
  ctx.fill();

  // Hat band
  ctx.fillStyle = COL.hatBand;
  ctx.fillRect(-15, -S-2, 30, 6);

  // Hat buckle
  ctx.fillStyle = COL.hatBuckle;
  ctx.fillRect(-5, -S-3, 10, 8);
  ctx.fillStyle = COL.hatBand;
  ctx.fillRect(-3, -S-1, 6, 4);

  // Hat highlight
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath();
  ctx.roundRect(-10, -S-20, 10, 18, [4,4,0,0]);
  ctx.fill();

  // Ears
  ctx.fillStyle = COL.skin;
  ctx.beginPath(); ctx.ellipse(-S-1, 0, 5, 7, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(S+1, 0, 5, 7, 0, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawScore() {
  if (gameState==='playing') {
    ctx.fillStyle = COL.scoreBox;
    ctx.beginPath(); ctx.roundRect(W/2-30,15,60,45,10); ctx.fill();
    ctx.fillStyle = COL.text;
    ctx.font = 'bold 32px "Segoe UI",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(score, W/2, 38);
  }
}

function drawStart() {
  // Clover emoji decoration
  ctx.font = '28px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('☘️', W/2 - 120, 118);
  ctx.fillText('☘️', W/2 + 120, 118);

  ctx.fillStyle = 'rgba(45,140,60,0.5)';
  ctx.font = 'bold 42px "Segoe UI",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('FLAPPY FOX', W/2+2, 120+2);
  ctx.fillStyle = '#2d8c3c';
  ctx.fillText('FLAPPY FOX', W/2, 120);

  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '16px "Segoe UI",sans-serif';
  ctx.fillText('by Lucky Arena', W/2, 160);

  const pulse = 0.5+Math.sin(frame*0.08)*0.3;
  ctx.fillStyle = `rgba(255,255,255,${pulse})`;
  ctx.font = '18px "Segoe UI",sans-serif';
  ctx.fillText('TAP TO PLAY', W/2, H*0.65);

  if (bestScore>0) {
    ctx.fillStyle = COL.gold;
    ctx.font = 'bold 16px "Segoe UI",sans-serif';
    ctx.fillText('BEST: '+bestScore, W/2, H*0.72);
  }
}

function drawDeath() {
  ctx.fillStyle = 'rgba(15,12,41,0.7)';
  ctx.fillRect(0,0,W,H);

  ctx.font = '28px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🍀', W/2, H*0.24);

  ctx.fillStyle = '#2d8c3c';
  ctx.font = 'bold 38px "Segoe UI",sans-serif';
  ctx.fillText('GAME OVER', W/2, H*0.3);

  ctx.fillStyle = 'rgba(124,58,237,0.4)';
  ctx.beginPath(); ctx.roundRect(W/2-90,H*0.38,180,120,15); ctx.fill();
  ctx.strokeStyle = 'rgba(168,85,247,0.5)'; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '16px "Segoe UI",sans-serif';
  ctx.fillText('SCORE', W/2, H*0.43);

  ctx.fillStyle = COL.text;
  ctx.font = 'bold 40px "Segoe UI",sans-serif';
  ctx.fillText(score, W/2, H*0.49);

  ctx.fillStyle = COL.gold;
  ctx.font = '14px "Segoe UI",sans-serif';
  ctx.fillText('BEST: '+bestScore, W/2, H*0.55);

  const pulse = 0.5+Math.sin(frame*0.08)*0.3;
  ctx.fillStyle = `rgba(255,255,255,${pulse})`;
  ctx.font = '18px "Segoe UI",sans-serif';
  ctx.fillText('TAP TO RESTART', W/2, H*0.7);
}

function loop() {
  update();
  drawBg();
  for (const p of pipes) drawPipe(p);
  drawGround();
  drawParticles();
  drawLeprechaun();
  drawScore();
  if (gameState==='start') drawStart();
  if (gameState==='dead') drawDeath();
  if (flashAlpha>0) {
    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
    ctx.fillRect(0,0,W,H);
  }
  requestAnimationFrame(loop);
}

mkStars(); reset(); loop();
</script>
</body>
</html>
